name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ⚙️ Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Настройка Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Установка зависимостей проекта
        run: npm install

      - name: 🛠️ Генерация нативного Android проекта (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Выдача прав на выполнение Gradle
        run: chmod +x android/gradlew

      - name: 🚀 Сборка APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: farmer-orders-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
