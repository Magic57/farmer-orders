name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ⚙️ Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Настройка Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Установка зависимостей проекта
        run: npm install

      - name: 🛠️ Генерация нативного Android проекта (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 📦 Предварительная упаковка JS-бандла и ассетов
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: 🔑 Выдача прав на выполнение Gradle
        run: chmod +x android/gradlew

      - name: 🚀 Сборка автономного APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug -PreactNativeDevServerPort=8081 --no-daemon

      - name: 🔍 Поиск и сохранение APK
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;

      - name: 📤 Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: farmer-orders-apk
          path: output-apk/*.apk
          retention-days: 14
